
name: Test Pipeline

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Lint
        run: |
          # install flake8
          pip install flake8
          # run flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Security
        run: |
          # install bandit
          pip install bandit
          # run bandit
          bandit -r .

      - name: Test
        run: |
          # install pytest
          pip install pytest
          # run pytest
          pytest tests/

      - name: Build and push Docker image
        run: |
          # login to AWS
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          # build and push Docker image
          docker build -t $ECR_REPO .
          docker tag $ECR_REPO:latest $ECR_REPO:latest
          docker push $ECR_REPO:latest

      - name: Deploy to EC2
        run: |
          # deploy to EC2
          if [ "$GITHUB_BRANCH" == "main" ]; then
            # for main branch, deploy to production
            ansible-playbook -i hosts deploy.yml -e env=production
          elif [ "$GITHUB_BRANCH" == "dev" ]; then
            # for dev branch, deploy to staging
            ansible-playbook -i hosts deploy.yml -e env=staging
          fi
          # cache dependencies
          mkdir -p ~/.cache
          pip freeze > ~/.cache/requirements.txt
  
